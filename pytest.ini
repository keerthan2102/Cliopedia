[pytest]
# `python -m pytest` puts the working directory on sys.path; the bare `pytest`
# command does not. Without this, `pytest` fails to import cliopedia while
# `python -m pytest` succeeds — the same test suite passing or failing
# depending on how it was invoked, which is the kind of difference that costs
# an hour to notice.
#
# pythonpath makes both forms work from the repo root, so the command in
# CLAUDE.md §3 and README is the command that runs.
pythonpath = .
testpaths = tests
